[project]
name = "adk-agent-basics-lab"
version = "0.1.0"
description = "Offline-first lab for the Google ADK Agent and tool boundary"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_basics"]
