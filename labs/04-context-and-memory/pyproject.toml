[project]
name = "adk-context-memory-lab"
version = "0.1.0"
description = "Data lifecycle comparison across ADK context, state, artifacts and memory"
requires-python = ">=3.10"
dependencies = [
  "google-adk @ git+https://github.com/google/adk-python.git@a56f6e13ae38296b608808c7a3b37efe4b8c862e",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context_memory_lab"]
